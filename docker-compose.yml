services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "80"
    labels:
      science26.public: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
